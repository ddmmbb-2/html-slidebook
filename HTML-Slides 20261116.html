<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>HTML 簡報</title>
<style>
:root {
  font-family: "Geist", "Inter", "Noto Sans CJK TC", "Microsoft JhengHei", system-ui, sans-serif;
  color: #272822;
  background: #f8f7f3;
  font-size: 14px;
  --paper: #fbfaf6;
  --panel: #fffefb;
  --border: #e4e0d6;
  --ink: #272822;
  --muted: #686963;
  --accent: #a63e22;
  --accent-dark: #893017;
  --accent-light: #faeee7;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; }
button, input, textarea, select { font: inherit; }
button { cursor: pointer; }
button:disabled { opacity: .4; cursor: default; }
:focus-visible { outline: 2px solid #a63e22; outline-offset: 2px; }
h2, h3, p { margin: 0; }
.app-header {
  min-height: 65px;
  display: flex;
  align-items: center;
  gap: 22px;
  padding: 10px 20px;
  border-bottom: 1px solid var(--border);
  background: var(--panel);
}
.brand { display: flex; gap: 9px; align-items: center; font-size: 16px; font-weight: 750; white-space: nowrap; }
.app-version { color: var(--muted); font: 11px ui-monospace, monospace; }
.brand-mark {
  display: grid;
  place-items: center;
  width: 31px;
  height: 30px;
  border-radius: 7px;
  color: white;
  background: var(--accent);
  font-size: 17px;
}
.document-title { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; padding-left: 20px; border-left: 1px solid var(--border); }
.document-title label { color: var(--muted); white-space: nowrap; font-size: 12px; }
.document-title input { max-width: 340px; border-color: transparent; background: transparent; font-weight: 650; }
.document-title input:hover, .document-title input:focus { border-color: var(--border); background: white; }
.header-actions, .button-group, .slide-actions, .layer-actions, .show-navigation { display: flex; align-items: center; gap: 7px; }
.button {
  padding: 7px 11px;
  min-height: 34px;
  border: 1px solid var(--border);
  border-radius: 6px;
  color: inherit;
  background: var(--panel);
  font-weight: 630;
  white-space: nowrap;
}
.button:hover:enabled { background: #f3f0e8; }
.button.primary { background: var(--accent); color: white; border-color: var(--accent); }
.button.primary:hover:enabled { background: var(--accent-dark); border-color: var(--accent-dark); }
.button.icon { min-width: 34px; padding: 5px; font-size: 17px; line-height: 1; }
.button.small { padding: 5px 8px; font-size: 12px; }
.header-actions .button { padding: 8px 13px; }
.button span[aria-hidden] { margin-right: 3px; }
.text-icon { font-family: Georgia,serif; font-size: 16px; }
.workspace { height: calc(100dvh - 65px); min-height: 425px; display: grid; grid-template-columns: 192px minmax(0, 1fr) 248px; }
.slides-pane, .inspector { background: var(--panel); min-height: 0; }
.slides-pane { border-right: 1px solid var(--border); display: flex; flex-direction: column; }
.inspector { border-left: 1px solid var(--border); display: flex; flex-direction: column; }
.pane-heading { min-height: 56px; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 15px; }
.pane-heading h2 { font-size: 14px; }
.count { color: var(--muted); font: 12px ui-monospace, monospace; }
.outline-add { margin: 0 12px 13px; color: var(--accent-dark); text-align: left; }
.slide-list { list-style: none; overflow: auto; flex: 1; padding: 2px 11px 10px; margin: 0; }
.slide-list li { margin-bottom: 8px; }
.slide-item {
  width: 100%;
  text-align: left;
  padding: 6px;
  border: 1px solid transparent;
  border-radius: 7px;
  background: transparent;
  color: var(--ink);
}
.slide-item:hover { background: #f6f3ed; }
.slide-item[aria-current="true"] { background: var(--accent-light); border-color: #c67053; }
.mini-frame, .frame { width: 100%; aspect-ratio: 16/9; overflow: hidden; position: relative; }
.mini-frame { border: 1px solid #17170925; border-radius: 3px; }
.slide-caption { display: flex; gap: 8px; align-items: baseline; margin-top: 5px; }
.slide-index { color: var(--accent-dark); font: 11px ui-monospace, monospace; }
.slide-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; font-weight: 630; }
.slide-actions { justify-content: center; border-top: 1px solid var(--border); padding: 9px 4px; gap: 4px; }
.slide-actions .icon { min-width: 27px; }
.compose { display: grid; grid-template-rows: 52px minmax(0, 1fr) 38px; min-width: 0; min-height: 0; background: #f3f0e9; }
.compose:has(.import-media-notice:not([hidden])) { grid-template-rows: 52px auto minmax(0, 1fr) 38px; }
.import-media-notice {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 7px;
  padding: 5px 12px;
  background: var(--accent-light);
  color: var(--accent-dark);
  border-bottom: 1px solid var(--border);
  font-size: 12px;
}
.edit-bar { background: var(--paper); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 14px; padding: 0 14px; }
.insert-buttons { border-left: 1px solid var(--border); padding-left: 14px; }
.stage { min-height: 0; display: grid; place-items: center; position: relative; overflow: hidden; background-image: radial-gradient(#cdc6b9 1px, transparent 1px); background-size: 16px 16px; }
.stage > .frame { width: 0; background: var(--paper); box-shadow: 0 14px 38px #3b30232b, 0 0 0 1px #312c221f; }
.slide-surface { position: absolute; width: 1280px; height: 720px; transform-origin: top left; overflow: hidden; color: #202620; }
.slide-surface[data-pattern="grid"] { background-image: linear-gradient(90deg, #96978c39 1px, transparent 1px), linear-gradient(#96978c39 1px, transparent 1px); background-size: 64px 64px; }
.slide-surface[data-pattern="dots"] { background-image: radial-gradient(#96978c82 1.4px, transparent 1.4px); background-size: 24px 24px; }
.slide-background-image { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background-color: inherit; pointer-events: none; }
.slide-object { position: absolute; min-width: 0; min-height: 0; }
.slide-text {
  font-family: "Geist", "Inter", "Noto Sans CJK TC", "Microsoft JhengHei", system-ui, sans-serif;
  line-height: 1.19;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  overflow: hidden;
}
.slide-media { display: grid; place-items: center; }
.media-element { display: block; max-width: 100%; max-height: 100%; width: 100%; height: 100%; object-fit: contain; }
.media-element:not(audio) { position: absolute; inset: 0; }
audio.media-element { height: 54px; }
.media-fallback, .mini-media {
  display: grid;
  place-items: center;
  min-width: 0;
  min-height: 0;
  width: 100%;
  height: 100%;
  padding: 6px;
  overflow: hidden;
  text-align: center;
  overflow-wrap: anywhere;
  background: #292a26e8;
  color: #fffdf8;
  border: 1px solid #ffffff5a;
  font-size: 22px;
}
.mini-media { font-size: 35px; }
.slide-surface.editing .slide-object { cursor: move; touch-action: none; user-select: none; }
.slide-surface.editing .media-element { pointer-events: none; }
.slide-surface.editing .slide-object:hover { outline: 2px dashed #ed905c; }
.slide-surface.editing .slide-object.selected { outline: 3px solid #f08856; outline-offset: 2px; }
.slide-surface .inline-editor {
  position: absolute;
  z-index: 10000;
  resize: none;
  padding: 0;
  border: 0;
  border-radius: 0;
  outline: 3px solid #f08856;
  outline-offset: 2px;
  background: #fffdf7f5;
  color: #292822;
  font-family: inherit;
  line-height: 1.19;
  overflow-wrap: anywhere;
}
.stage-status { display: grid; grid-template-columns: 1fr 2fr 1fr; align-items: center; text-align: center; border-top: 1px solid var(--border); background: var(--paper); color: var(--muted); font-size: 12px; padding: 0 14px; }
.stage-status span:first-child { text-align: left; }
.stage-status span { grid-row: 1; }
#slidePosition { grid-column: 1; }
#editStatus { grid-column: 2; }
.stage-status span:last-child { text-align: right; grid-column: 3; }
.inspector-body { overflow: auto; }
.inspector-section { padding: 0 15px 16px; }
.inspector-section + .inspector-section { border-top: 1px solid var(--border); padding-top: 15px; }
.section-heading { display: flex; justify-content: space-between; align-items: center; min-height: 25px; margin-bottom: 8px; gap: 6px; }
.section-heading h3 { font-size: 13px; }
.field-label, .field-grid label { display: block; font-size: 12px; color: var(--muted); margin: 9px 0 5px; }
input:not([type="file"]), select, textarea {
  width: 100%;
  min-width: 0;
  padding: 6px 8px;
  min-height: 32px;
  border: 1px solid var(--border);
  border-radius: 5px;
  color: var(--ink);
  background: white;
}
textarea { resize: vertical; }
input[type="color"] { width: 39px; height: 28px; min-height: 28px; padding: 2px; cursor: pointer; }
.color-row { display: flex; justify-content: space-between; align-items: center; gap: 7px; margin-top: 10px; color: var(--muted); font-size: 12px; }
.field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 7px; }
.field-grid input, .field-grid select { display: block; margin-top: 4px; }
.geometry { margin-top: 3px; }
.layer-actions { margin-top: 9px; flex-wrap: wrap; gap: 5px; }
.quiet-button { border: 0; background: transparent; color: var(--accent-dark); padding: 3px; }
.quiet-button:hover { text-decoration: underline; }
.hint { color: var(--muted); font-size: 12px; line-height: 1.55; }
.media-name { font-size: 12px; overflow-wrap: anywhere; margin-bottom: 7px; }
dialog {
  width: min(460px, calc(100vw - 26px));
  max-height: calc(100dvh - 25px);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 17px 20px 19px;
  color: var(--ink);
  background: var(--panel);
  box-shadow: 0 20px 75px #32251b42;
}
dialog::backdrop { background: #261f1a6b; }
.dialog-head { display: flex; justify-content: space-between; align-items: center; gap: 13px; margin-bottom: 12px; }
.dialog-head h2 { font-size: 18px; }
.show-page-setting {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 12px;
  cursor: pointer;
}
.show-page-setting + .show-page-setting { margin-top: 8px; }
input[type="checkbox"] { width: 16px; height: 16px; min-height: 0; margin: 0; accent-color: var(--accent); cursor: pointer; }

#addDialog { width: min(740px, calc(100vw - 26px)); }
.layout-options { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.template-option {
  display: grid;
  min-width: 0;
  align-content: start;
  text-align: left;
  white-space: normal;
  gap: 3px;
  padding: 7px;
}
.template-preview {
  position: relative;
  overflow: hidden;
  width: 100%;
  aspect-ratio: 16 / 9;
  border-radius: 3px;
  margin-bottom: 3px;
  outline: 1px solid #241e161a;
  pointer-events: none;
}
.template-media-preview {
  display: grid;
  place-items: center;
  border: 4px dashed #756d5e;
  border-radius: 14px;
  color: #64594a;
  background: #e8e0cf;
  font-size: 42px;
}
.template-option span { color: var(--muted); font-size: 12px; font-weight: 400; }
.save-options { display: grid; gap: 7px; }
@media (max-width: 560px) {
  .layout-options { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 320px) {
  .layout-options { grid-template-columns: minmax(0, 1fr); }
}
#saveSummary, .save-options, .source-tools { margin-top: 12px; }
.source-tools .hint { margin-top: 5px; }
.save-message { margin-top: 8px; min-height: 1.4em; font-size: 12px; color: var(--accent-dark); }
.show { position: fixed; inset: 0; z-index: 10; color: #fff; background: #100f0e; }
.show:focus { outline: none; }
.show-stage { position: absolute; inset: 0; display: grid; place-items: center; }
.show-stage > .frame { width: 0; }
.show-bar {
  position: absolute;
  z-index: 2;
  bottom: 13px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 5px 7px;
  border-radius: 8px;
  background: #1b1b19e8;
  border: 1px solid #ffffff4a;
}
.show-bar .button { background: #292927; color: white; border-color: #ffffff4a; }
.show-bar .button:hover:enabled { background: #444440; }
.show-navigation span { min-width: 63px; text-align: center; font: 12px ui-monospace, monospace; }
@media (max-width: 420px) {
  .show-bar, .show-navigation { gap: 5px; }
  .show-bar .button { padding-inline: 6px; }
  .show-navigation span { min-width: 44px; }
}
kbd { font: 11px ui-monospace, monospace; opacity: .8; margin-left: 2px; }
.toast { position: fixed; z-index: 20; bottom: 48px; right: 16px; padding: 9px 13px; border-radius: 6px; color: white; background: #302821; max-width: calc(100% - 32px); }
@media (max-width: 950px) {
  .workspace { grid-template-columns: 146px minmax(0, 1fr) 207px; }
  .pane-heading { padding-inline: 10px; }
  .inspector-section { padding-inline: 10px; }
  .slide-list { padding-inline: 7px; }
}
@media (max-width: 690px) {
  .app-header { min-height: 60px; gap: 8px; padding: 7px 8px; }
  .brand-name, .document-title label { display: none; }
  .brand { gap: 4px; }
  .app-version { font-size: 10px; }
  .header-actions { gap: 4px; }
  .header-actions .button span[aria-hidden] { display: none; }
  .document-title { border: 0; padding-left: 0; }
  .header-actions .button { padding: 6px 8px; }
  .workspace { height: auto; grid-template-columns: 1fr; grid-template-areas: "compose" "slides" "inspector"; }
  .compose { grid-area: compose; grid-template-rows: 45px minmax(205px, 48vw) 30px; }
  .compose:has(.import-media-notice:not([hidden])) { grid-template-rows: 45px auto minmax(205px, 48vw) 30px; }
  .slides-pane { grid-area: slides; border: 0; }
  .inspector { grid-area: inspector; border: 0; border-top: 1px solid var(--border); }
  .pane-heading { min-height: 40px; }
  .outline-add { align-self: flex-start; margin-bottom: 6px; }
  .slide-list { display: flex; flex: initial; overflow-x: auto; padding-block: 4px; gap: 4px; }
  .slide-list li { width: 115px; flex: none; margin: 0; }
  .slide-actions { justify-content: flex-start; padding-inline: 10px; }
  .inspector-body { overflow: visible; }
  .edit-bar { padding-inline: 8px; gap: 7px; }
  .insert-buttons { padding-left: 7px; }
  .stage-status { font-size: 11px; }
}

.document-title input { background: transparent; border-color: transparent; }
.slide-surface textarea.inline-editor { border: 0; padding: 0; min-height: 0; border-radius: 0; background: #fffdf7f5; }
.resize-handle {
  position: absolute;
  z-index: 2;
  bottom: 0;
  right: 0;
  width: 23px;
  height: 23px;
  background: #f08856;
  border: 2px solid #fffdf9;
  border-radius: 3px;
  cursor: nwse-resize;
}

.rotate-handle {
  position: absolute;
  z-index: 2;
  top: 0;
  left: 50%;
  transform: translate(-50%, -50%);
  display: grid;
  place-items: center;
  width: 30px;
  height: 30px;
  border: 2px solid #fffdf9;
  border-radius: 50%;
  color: white;
  background: var(--accent);
  font: 22px / 1 system-ui, sans-serif;
  cursor: grab;
}
.rotate-handle:active { cursor: grabbing; }
.slide-media.stretch-image img.media-element { object-fit: fill; }
#imageFields { margin: 0 0 9px; }

#language { width: auto; max-width: 9rem; }
#aspectRatio { margin-bottom: 12px; }
#transparentText { margin-top: 3px; }
.color-row + .show-page-setting { margin-top: 6px; }
.slide-surface[data-pattern="cover"] {
  background-image: radial-gradient(circle at 87% 57%, #e4b681 0 13%, transparent 13.15%),
    radial-gradient(circle at 87% 57%, transparent 0 23%, #e4b68165 23.1% 23.35%, transparent 23.45%),
    radial-gradient(circle at 87% 57%, transparent 0 32%, #e4b68134 32.1% 32.3%, transparent 32.4%),
    radial-gradient(circle at 87% 57%, transparent 0 41%, #e4b68125 41.1% 41.25%, transparent 41.4%);
}
.slide-surface[data-pattern="editorial"] {
  background-image: linear-gradient(90deg, #a65b43 0 14%, #a65b4350 14% 100%);
  background-position: 8.5% 32%;
  background-size: 84% 2px;
  background-repeat: no-repeat;
}
.slide-surface[data-pattern="section"] {
  background-image: linear-gradient(120deg, transparent 0 67%, #ffffff1b 67% 80%, #ffffff30 80%);
}
.slide-surface[data-pattern="columns"], .slide-surface[data-pattern="steps"], .slide-surface[data-pattern="media"] {
  background-repeat: no-repeat;
}
.slide-surface[data-pattern="columns"] {
  background-image: linear-gradient(#fffdf8, #fffdf8), linear-gradient(#fffdf8, #fffdf8);
  background-size: 41% 53%;
  background-position: 12% 84%, 88% 84%;
}
.slide-surface[data-pattern="media"] {
  background-image: linear-gradient(#d8e3df, #d8e3df);
  background-size: 52% 57%;
  background-position: 85.4% 79.1%;
}
.slide-surface[data-pattern="steps"] {
  background-image: linear-gradient(#fffefbeb, #fffefbeb), linear-gradient(#fffefbeb, #fffefbeb), linear-gradient(#fffefbeb, #fffefbeb);
  background-size: 26% 52%;
  background-position: 9.45% 79.2%, 50% 79.2%, 90.55% 79.2%;
}
.slide-surface[data-pattern="quote"] {
  background-image: linear-gradient(#c99963, #c99963), linear-gradient(#c99963, #c99963),
    linear-gradient(#c9996366, #c9996366), linear-gradient(#c9996366, #c9996366);
  background-size: 86% 2px, 86% 2px, 2px 80%, 2px 80%;
  background-position: center 10%, center 90%, 7% center, 93% center;
  background-repeat: no-repeat;
}
.template-media-preview {
  border: 2px dashed #526e6570;
  border-radius: 0;
  background: transparent;
  color: #38544b;
  font-size: 36px;
}
@media (max-width: 690px) {
  .app-header { flex-wrap: wrap; }
  .document-title { min-width: 8rem; }
  .header-actions { flex-wrap: wrap; margin-left: auto; }
}
.symbol-glyph {
  font-family: "Segoe UI Symbol", "Apple Symbols", "DejaVu Sans", "Noto Sans Symbols 2", sans-serif;
  font-variant-emoji: text;
  line-height: 1;
}
.slide-symbol { display: grid; place-items: center; }
.slide-symbol .symbol-glyph { pointer-events: none; white-space: nowrap; }
.symbol-group + .symbol-group { margin-top: 15px; }
.symbol-group h3 { font-size: 13px; margin-bottom: 6px; }
.symbol-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(39px, 1fr)); gap: 6px; }
#symbolDialog { width: min(635px, calc(100vw - 26px)); }
.symbol-option { min-height: 40px; padding: 4px; font-size: 25px; }
.symbol-inspector { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
.symbol-inspector > span {
  display: grid;
  place-items: center;
  flex: 0 0 39px;
  height: 39px;
  font-size: 24px;
  background: var(--accent-light);
  border-radius: 5px;
}
.symbol-inspector label { min-width: 0; color: var(--muted); font-size: 12px; }
.geometry input[readonly] { background: var(--paper); color: var(--muted); }
@media (max-width: 420px) {
  .insert-buttons .button { padding-inline: 6px; }
  #addSymbol > span[aria-hidden] { display: none; }
}

#videoFields { margin: 0 0 9px; }
.video-notice {
  position: absolute;
  z-index: 2;
  left: 50%;
  bottom: 70px;
  transform: translateX(-50%);
  width: max-content;
  max-width: calc(100% - 24px);
  padding: 7px 12px;
  border-radius: 6px;
  background: #1b1b19ef;
  color: white;
  font-size: 13px;
  pointer-events: none;
}
</style>
</head>
<body>
<header class="app-header">
  <div class="brand"><span class="brand-mark" aria-hidden="true">▰</span><span class="brand-name" data-ui="HTML 簡報">HTML 簡報</span><span class="app-version">v1.4.3</span></div>
  <div class="document-title">
    <label for="deckTitle" data-ui="簡報名稱">簡報名稱</label>
    <input id="deckTitle" maxlength="100" placeholder="未命名簡報" data-ui-placeholder="未命名簡報">
  </div>
  <div class="header-actions">
    <select id="language" aria-label="介面語言" data-ui-aria-label="介面語言" title="介面語言" data-ui-title="介面語言">
      <option value="auto" data-ui="自動">自動</option>
      <option value="zh-Hant" translate="no">繁體中文</option>
      <option value="en" translate="no">English</option>
      <option value="ja" translate="no">日本語</option>
    </select>
    <button id="openDeck" class="button" title="開啟 HTML 簡報" data-ui-title="開啟 HTML 簡報" data-ui="開啟簡報">開啟簡報</button>
    <input id="deckFile" type="file" accept=".html,.htm,text/html" hidden>
    <button id="play" class="button" title="從目前頁播放（F5）" data-ui-title="從目前頁播放（F5）"><span aria-hidden="true">▷</span> <span class="ui-label" data-ui="播放">播放</span></button>
    <button id="save" class="button primary"><span aria-hidden="true">↓</span> <span class="ui-label" data-ui="另存新檔">另存新檔</span></button>
  </div>
</header>
<main class="workspace" id="workspace">
  <aside class="slides-pane" aria-label="投影片列表" data-ui-aria-label="投影片列表">
    <div class="pane-heading"><h2 data-ui="投影片">投影片</h2><span id="pageCount" class="count"></span></div>

<script>
"use strict";

// model.mjs
const model = (() => {
const WIDTH = 1280;
const HEIGHT = 720;
const FONT_FAMILIES = Object.freeze({
  default: '"Geist", "Inter", "Noto Sans CJK TC", "Microsoft JhengHei", system-ui, sans-serif',
  sans: 'Arial, Helvetica, "Microsoft JhengHei", "PingFang TC", "Noto Sans CJK TC", sans-serif',
  serif: '"Times New Roman", "Songti TC", PMingLiU, "Noto Serif CJK TC", serif',
  mono: '"Courier New", Courier, "Microsoft JhengHei", "PingFang TC", "Noto Sans Mono CJK TC", monospace',
});

function heightFor(ratio) {
  return ratio === "4:3" ? 960 : HEIGHT;
}

function fontKey(key) {
  return Object.hasOwn(FONT_FAMILIES, key) ? key : "default";
}
const FORMAT_VERSION = 1;
const MIN_SYMBOL_SIZE = 16;
const MAX_SYMBOL_SIZE = 600;
const SYMBOL_BOX_SCALE = 1.25;

function makeId() {
  return Array.from(crypto.getRandomValues(new Uint8Array(12)), (byte) =>
    byte.toString(16).padStart(2, "0")).join("");
}

function openDeck(saved) {
  if (saved.version !== FORMAT_VERSION || typeof saved.title !== "string" ||
      !Array.isArray(saved.slides) || saved.slides.length === 0) {
    throw new Error("無法讀取此版本的簡報資料。");
  }
  const embedded = new Map();
  const assets = Object.fromEntries(Object.entries(saved.assets ?? {}).map(([id, asset]) => {
    const { data, ...metadata } = asset;
    if (data) embedded.set(id, data);
    return [id, metadata];
  }));
  const deck = {
    version: FORMAT_VERSION,
    title: saved.title,
    aspectRatio: saved.aspectRatio === "4:3" ? "4:3" : "16:9",
    slides: saved.slides,
    assets,
    presentation: {
      showPageNumber: saved.presentation?.showPageNumber !== false,
      showEditorPageNumber: saved.presentation?.showEditorPageNumber !== false,
    },
  };
  return { deck, embedded };
}

function referencedAssets(deck) {
  const ids = new Set();
  for (const slide of deck.slides) {
    if (typeof slide.backgroundAsset === "string" && slide.backgroundAsset) ids.add(slide.backgroundAsset);
    for (const object of slide.objects) {
      if (object.type === "media") ids.add(object.asset);
    }
  }
  return Array.from(ids, (id) => [id, deck.assets[id]]);
}

function clamp(number, min, max) {
  return Math.min(max, Math.max(min, number));
}

function boxValue(object, key, value) {
  const limits = { x: [0, 100 - object.w], y: [0, 100 - object.h], w: [1, 100 - object.x], h: [1, 100 - object.y] };
  return clamp(value, ...limits[key]);
}

function isImage(object, assets) {
  return object?.type === "media" && assets[object.asset]?.kind === "image";
}

function canRotate(object, assets) {
  return (object?.type === "text" && object.symbol === true) || isImage(object, assets);
}

function rotationValue(value) {
  if (!Number.isFinite(value)) return 0;
  return ((Math.round(value) + 180) % 360 + 360) % 360 - 180;
}

function imageFit(value) {
  return value === "stretch" ? "stretch" : "contain";
}

function resizeLockedImage(object, scale) {
  const minScale = Math.max(1 / object.w, 1 / object.h);
  const maxScale = Math.min((100 - object.x) / object.w, (100 - object.y) / object.h);
  const factor = clamp(scale, minScale, maxScale);
  return { w: object.w * factor, h: object.h * factor };
}

function fitImageBox(object, naturalRatio, slideRatio) {
  if (!(naturalRatio > 0) || !Number.isFinite(naturalRatio)) return {};
  const percentRatio = naturalRatio * heightFor(slideRatio) / WIDTH;
  const w = Math.max(1, Math.min(object.w, object.h * percentRatio));
  const h = Math.max(1, Math.min(object.h, object.w / percentRatio));
  return { x: object.x + (object.w - w) / 2, y: object.y + (object.h - h) / 2, w, h };
}

function textObject(text, box, size, color = "#25322d", weight = 400) {
  const [x, y, w, h] = box;
  return { id: makeId(), type: "text", x, y, w, h, text, size, color, weight, align: "left" };
}

function symbolBox(size, ratio) {
  return {
    w: size * SYMBOL_BOX_SCALE * 100 / WIDTH,
    h: size * SYMBOL_BOX_SCALE * 100 / heightFor(ratio),
  };
}

function resizeSymbol(object, size, ratio) {
  const available = Math.min((100 - object.x) * WIDTH, (100 - object.y) * heightFor(ratio)) / 100;
  const maxSize = Math.min(MAX_SYMBOL_SIZE, Math.floor(available / SYMBOL_BOX_SCALE + 1e-7));
  const nextSize = clamp(Math.round(size), MIN_SYMBOL_SIZE, maxSize);
  return { size: nextSize, ...symbolBox(nextSize, ratio) };
}

function symbolObject(glyph, ratio, background) {
  const size = 114;
  const { w, h } = symbolBox(size, ratio);
  const channels = /^#([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(background);
  const [red, green, blue] = channels ? channels.slice(1).map((channel) => parseInt(channel, 16)) : [255, 255, 255];
  const brightness = 0.299 * red + 0.587 * green + 0.114 * blue;

// save-dialog.mjs
const bindSaveDialog = (() => {
return function bindSaveDialog({ dom, document, window, store, model, media, exporter, canvas, view, toast, urls, onAttach, t }) {
  const { id, on } = dom;
  let saving = false;

  function updateOptions() {
    const { count, unavailable, relative, canLink } = exporter.inspect(store.deck);
    const pages = store.deck.slides.length;
    id("saveSummary").textContent = count
      ? t("{pages} 張投影片，{count} 個影音檔案。ZIP 解壓縮後即可離線開啟。", { pages, count })
      : t("{pages} 張投影片。可直接下載 HTML。", { pages });
    id("sourceTools").hidden = relative === 0;
    id("sourceSummary").textContent = unavailable
      ? t("要重新打包原影音，請選取同時包含原 HTML 與 media 資料夾的資料夾。")
      : t("原影音檔案已就緒。");
    id("savePackage").hidden = count === 0;
    id("savePackage").disabled = saving || unavailable > 0;
    id("saveStandalone").disabled = saving || unavailable > 0;
    id("saveLinked").hidden = !canLink;
    id("saveLinked").disabled = saving;
    id("saveStandalone").classList.toggle("primary", count === 0);
    id("pickFolder").disabled = saving;
  }

  function open() {
    canvas.closeInline(true);
    id("saveName").value = store.deck.title || t("未命名簡報");
    id("saveMessage").textContent = "";
    updateOptions();
    id("saveDialog").showModal();
  }

  function download({ blob, filename }) {
    const url = urls.createObjectURL(blob);
    const link = dom.make("a");
    link.href = url;
    link.download = filename;
    document.body.append(link);
    link.click();
    link.remove();
    window.setTimeout(() => urls.revokeObjectURL(url), 60000);
  }

  async function save(mode) {
    if (saving) return;
    const revision = store.revision;
    const deck = structuredClone(store.deck);
    saving = true;
    id("saveMessage").textContent = t("正在準備下載…");
    updateOptions();
    try {
      download(await exporter.create(deck, mode, id("saveName").value));
      store.markSaved(revision);
      view.syncStatus();
      id("saveDialog").close();
      toast(mode === "linked" ? t("已開始下載，請將 HTML 放回原本的 media 資料夾旁。") : t("已開始下載。"));
    } catch (error) {
      id("saveMessage").textContent = error instanceof RangeError
        ? t("影音太大，無法製作這個檔案。請改用 ZIP 或拆成多份簡報。")
        : t(error.message || "另存失敗。");
    } finally {
      saving = false;
      updateOptions();
    }
  }

  on("save", "click", open);
  on("savePackage", "click", () => save("package"));
  on("saveStandalone", "click", () => save("standalone"));
  on("saveLinked", "click", () => save("linked"));
  on("pickFolder", "click", () => id("sourceFolder").click());
  on("sourceFolder", "change", (event) => {
    const restored = media.attachFolder(event.target.files, model.referencedAssets(store.deck));
    event.target.value = "";
    updateOptions();
    view.render();
    onAttach();
    id("saveMessage").textContent = restored
      ? t("已找到 {count} 個原影音檔案。", { count: restored })
      : t("選取的資料夾沒有這份簡報的影音。");
  });
  for (const event of ["cancel", "submit"]) {
    on("saveDialog", event, (action) => { if (saving) action.preventDefault(); });
  }

  return { open };
}
})();

const bindOpenDeck = (() => {
return function bindOpenDeck({ dom, window, store, model, media, htmlFormat, canvas, view, toast, t }) {
  const { id, on } = dom;
  let imported = false;
  let opening = false;

  function refreshMediaNotice() {
    const missing = imported ? model.referencedAssets(store.deck).filter(([id, asset]) =>
      media.origin(id) === "relative" && !media.fileFor(id, asset)).length : 0;
    id("importMediaNotice").hidden = missing === 0;
    id("importMediaMessage").textContent = missing
      ? t("請選取原 HTML 所在的資料夾，連結 {count} 個外部影音檔。", { count: missing })
      : "";
    view.fit();
  }

  on("openDeck", "click", () => id("deckFile").click());
  on("deckFile", "change", async (event) => {
    const file = event.target.files[0];
    event.target.value = "";

      const { deck, embedded } = model.openDeck(htmlFormat.readDeck(await file.text()));

      toast(t("無法開啟此檔案。請選擇 HTML 簡報另存的 .html 檔。"));
    } finally {
      opening = false;
    }

  on("chooseImportedFolder", "click", () => id("importedFolder").click());
  on("importedFolder", "change", (event) => {

// playback.mjs
const bindPlayback = (() => {
const CONTROL_DURATION = 3000;
const CONTROL_EDGE_HEIGHT = 72;

return function bindPlayback({ dom, document, window, store, model, slideView, canvas, toast, t }) {
  const { id, on } = dom;
  const show = id("show");
  const bar = id("showBar");
  const surface = id("showSurface");
  const videoNotice = id("videoNotice");
  const started = new WeakSet();
  let index = 0;
  let controlTimer;
  const active = () => !show.hidden;

  function hideControls() {
    window.clearTimeout(controlTimer);
    if (bar.contains(document.activeElement)) show.focus({ preventScroll: true });
    bar.hidden = true;
  }

  function showControls() {
    if (!active()) return;
    bar.hidden = false;
    window.clearTimeout(controlTimer);
    controlTimer = window.setTimeout(hideControls, CONTROL_DURATION);
  }

  function revealAtBottom(event) {
    const bottom = show.getBoundingClientRect().bottom;
    if (event.clientY >= bottom - CONTROL_EDGE_HEIGHT) showControls();
  }

  function fit() {
    if (active()) slideView.fit(id("showStage"), id("showFrame"), id("showSurface"), 0, store.deck.aspectRatio);
  }

  const videos = () => surface.querySelectorAll("video");
  const pendingVideo = () => Array.from(videos()).find((video) =>
    video.dataset.videoStart === "next" && !started.has(video));

  function syncNextButton() {
    const pending = Boolean(pendingVideo());
    const next = id("nextShow");
    next.disabled = !pending && index >= store.deck.slides.length - 1;
    const label = t(pending ? "播放影片" : "下一頁");
    next.setAttribute("aria-label", label);
    next.title = label;
    next.textContent = pending ? "▶" : "→";
  }

  function stopVideos() {
    for (const video of videos()) video.pause();
    videoNotice.hidden = true;
  }

  function playVideo(video) {
    video.play().catch((error) => {
      if (error.name === "AbortError" || !active() || !surface.contains(video)) return;
      videoNotice.textContent = t("請按影片上的播放鍵開始播放。");
      videoNotice.hidden = false;
    });
  }

  function draw() {
    const { slides, assets } = store.deck;
    stopVideos();
    slideView.draw(surface, slides[index], assets, "show", store.deck.aspectRatio);
    for (const video of videos()) {
      video.addEventListener("play", () => {
        started.add(video);
        videoNotice.hidden = true;
        syncNextButton();
      }, { once: true });
      video.addEventListener("error", syncNextButton, { once: true });
      if (video.dataset.videoStart === "auto") playVideo(video);
    }
    const position = id("showPosition");
    position.hidden = !store.deck.presentation.showPageNumber;
    position.textContent = (index + 1) + " / " + slides.length;
    id("prevShow").disabled = index <= 0;
    syncNextButton();
    fit();
  }

  function start(from) {
    canvas.closeInline(true);
    index = from;
    id("workspace").inert = true;
    document.querySelector(".app-header").inert = true;
    show.hidden = false;
    draw();
    show.focus({ preventScroll: true });
    showControls();
  }

  function stop() {
    if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
    hideControls();
    show.hidden = true;
    stopVideos();
    surface.replaceChildren();
    id("workspace").inert = false;
    document.querySelector(".app-header").inert = false;
    id("play").focus();
  }

  function advance(target) {
    const next = model.clamp(target, 0, store.deck.slides.length - 1);
    if (next === index) return;
    index = next;
    draw();
    showControls();
  }

  function next() {
    const video = pendingVideo();
    if (!video) {
      advance(index + 1);
      return;
    }
    started.add(video);
    playVideo(video);
    syncNextButton();
    showControls();
  }

  on("show", "pointermove", revealAtBottom);
  on("show", "pointerdown", revealAtBottom);
  on("showBar", "focusin", showControls);
  on("play", "click", () => start(store.index()));
  on("prevShow", "click", () => advance(index - 1));
  on("nextShow", "click", next);
  on("exitShow", "click", stop);
  on("fullscreen", "click", async () => {
    try {
      if (document.fullscreenElement) await document.exitFullscreen();
      else await show.requestFullscreen();
    } catch {
      toast(t("瀏覽器目前無法進入全螢幕。"));
    }
  });
  document.addEventListener("fullscreenchange", () => {
    id("fullscreen").textContent = document.fullscreenElement ? t("退出全螢幕") : t("全螢幕");
    fit();
    showControls();
  });

  function keydown(event) {
    if (event.key === "Escape") {
      event.preventDefault();
      stop();
      return;
    }
    if (event.key === "Tab" && bar.hidden) showControls();
    if (event.target.closest("video, audio")) return;
    if (event.key === " " && event.target.closest("button")) return;
    if (event.key === "ArrowRight" || event.key === "PageDown" || event.key === " ") {
      event.preventDefault();
      if (!event.repeat) next();
      return;
    }
    const targets = {
      ArrowLeft: index - 1, PageUp: index - 1,
      Home: 0, End: store.deck.slides.length - 1,
    };
    if (!Object.hasOwn(targets, event.key)) return;
    event.preventDefault();
    advance(targets[event.key]);
  }

  return { active, start, fit, keydown };
}
})();

const createTemplatePicker = (() => {
return function createTemplatePicker({ dom, window, slideView, templates, model, store, t }) {
  const dialog = dom.id("addDialog");
  const options = dom.id("templateOptions");
  const catalog = new Map(templates.map((template) => [template.id, template]));
  const previews = [];

  function fit() {
    for (const [frame, surface] of previews) slideView.scale(surface, frame.clientWidth);
  }

  function tile(template) {
    const button = dom.make("button", "button template-option");
    button.type = "button";
    button.dataset.layout = template.id;

    const frame = dom.make("div", "template-preview");
    frame.style.aspectRatio = store.deck.aspectRatio.replace(":", " / ");
    frame.setAttribute("aria-hidden", "true");
    const surface = dom.make("div", "slide-surface");
    slideView.draw(surface, model.slideFromTemplate(template, t), {}, "mini", store.deck.aspectRatio);
    if (template.mediaBox) {
      const placeholder = dom.make("div", "slide-object template-media-preview");
      const [x, y, w, h] = template.mediaBox;
      slideView.applyBox(placeholder, { x, y, w, h });
      placeholder.textContent = t("圖片／影音");
      surface.append(placeholder);
    }
    frame.append(surface);
    previews.push([frame, surface]);

    const label = dom.make("strong");
    label.textContent = t(template.label);
    const description = dom.make("span");
    description.textContent = t(template.description);
    button.append(frame, label, description);
    return button;
  }

  function open() {
    previews.length = 0;
    options.replaceChildren(...templates.map(tile));
    dialog.showModal();
    fit();
  }

  const resize = new window.ResizeObserver(fit);
  resize.observe(options);
  return { open, get: (id) => catalog.get(id) };
}
})();

// main.mjs
const start = (() => {
return function start({ window, document, modules }) {
  const {
    model, createDOM, createStore, filenames, createMedia, htmlFormat, makeZip, createExporter,
    createSlideView, createEditorView, createEditActions, bindCanvas, bindEditor, bindSaveDialog, bindOpenDeck, bindPlayback, slideTemplates, createTemplatePicker, createSymbolPicker, createI18n, messages,
  } = modules;
  const dom = createDOM(document);
  const serialize = htmlFormat.capture(document);
  const language = createI18n({ window, document, messages, select: dom.id("language") });
  const { t } = language;
  const { deck, embedded } = model.openDeck(JSON.parse(dom.id("deckData").textContent));
  const store = createStore(deck);
  const urls = window.URL;
  const media = createMedia({ embedded, makeId: model.makeId, filenames, urls, createImage: () => dom.make("img") });
  const exporter = createExporter({ model, media, filenames, serialize, makeZip, t });
  const slideView = createSlideView({ dom, media, model, t });
  const view = createEditorView({ dom, document, store, slideView, window, model, t });
  const canvas = bindCanvas({ dom, window, store, model, view, slideView, t });
  const actions = createEditActions({ store, model, media, t });
  const templatePicker = createTemplatePicker({ dom, window, slideView, templates: slideTemplates, model, store, t });

  const symbolPicker = createSymbolPicker({ dom, t });
  const symbolSize = dom.id("symbolSize");
  symbolSize.min = model.MIN_SYMBOL_SIZE;
  symbolSize.max = model.MAX_SYMBOL_SIZE;

  let toastTimer;
  function toast(message) {
    const element = dom.id("toast");
    element.textContent = message;
    element.hidden = false;
    window.clearTimeout(toastTimer);
    toastTimer = window.setTimeout(() => { element.hidden = true; }, 3300);
  }

  const openDeck = bindOpenDeck({ dom, window, store, model, media, htmlFormat, canvas, view, toast, t });
  const editor = bindEditor({ dom, window, store, model, view, canvas, actions, templatePicker, symbolPicker, toast, t,
    refreshImportedMedia: openDeck.refreshMediaNotice });
  const saveDialog = bindSaveDialog({ dom, document, window, store, model, media, exporter, canvas, view, toast, urls, t,
    onAttach: openDeck.refreshMediaNotice });
  const playback = bindPlayback({ dom, document, window, store, model, slideView, canvas, toast, t });
  window.addEventListener("keydown", (event) => {
    if (event.defaultPrevented || event.isComposing) return;
    if (playback.active()) {
      playback.keydown(event);
      return;
    }
    if (document.querySelector("dialog[open]")) return;
    if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "s") {
      event.preventDefault();
      saveDialog.open();
      return;
    }
    if (event.key === "F5") {
      event.preventDefault();
      playback.start(event.shiftKey ? 0 : store.index());
      return;
    }
    editor.keydown(event);
  });

  dom.on("language", "change", (event) => {
    canvas.closeInline(true);
    language.change(event.target.value);
    view.render();
    openDeck.refreshMediaNotice();
  });
  const observer = new window.ResizeObserver(() => {
    view.fit();
    playback.fit();
  });
  observer.observe(dom.id("stage"));
  observer.observe(dom.id("slideList"));
  view.render();
}
})();
